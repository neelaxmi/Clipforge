name: ClipForge build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --check api/storage/getpronto.js
      - run: node --check api/render/rendobar.js
      - run: node --check api/ai/director.js

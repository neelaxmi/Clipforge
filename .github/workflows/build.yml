name: ClipForge build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --check api/storage/getpronto.js
      - run: node --check api/render/rendobar.js
      - run: node --check js/factory.js
      - run: node --check js/upload.js\n      - run: node --check js/integrations.js\n      - run: node --check api/google/_lib.js\n      - run: node --check api/google/oauth/start.js\n      - run: node --check api/google/oauth/callback.js\n      - run: node --check api/google/oauth/status.js\n      - run: node --check api/google/oauth/disconnect.js\n      - run: node --check api/google/drive.js\n      - run: node --check api/google/youtube.js
